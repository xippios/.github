# Ruff for the scripts of this repository (CI runs `uvx ruff check scripts` and
# `uvx ruff format --check scripts`); the family's line length and target.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "D", "ANN", "PTH", "PT", "C4", "ISC"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"scripts/tests/**" = ["D", "ANN"]

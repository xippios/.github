name: Gate
description: "A human action, assigned to the human. Title: the human's action in the imperative: `Create the six issue types`."
type: gate
body:
  - type: textarea
    id: what
    attributes:
      label: "What"
      description: "what the human does, as numbered steps. Each step names the command or the link."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why"
      description: "the decision or row that needs it, cited."
  - type: textarea
    id: proof
    attributes:
      label: "Proof"
      description: "what the session checks to see it done, such as a `doctor` check that turns green."

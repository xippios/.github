# Written by coordinate from docs/style/issues.md of coordinate-core v0.7.3 (C73, C74).
# Edit that style and adopt its release; never this file.
name: Change
description: "A change requested of this repository. Title: a change in the imperative: `Refuse a heading inside a section flag`."
type: change
labels: ["proposed"]
body:
  - type: textarea
    id: what
    attributes:
      label: "What"
      description: "one or two sentences that state the whole change or gap, then bullets for several parts."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why"
      description: "the reason, with its citations. A gap says what was seen, where, and how. One for an open package's milestone says first why the product would not ship robust without it, such as a proof it breaks. Any other takes the next patch's `--milestone`, or no milestone while that patch has no package issue (https://github.com/xippios/coordinate-core/issues/624)."
  - type: textarea
    id: proof
    attributes:
      label: "Proof"
      description: "how one sees it done: the test, the command and its expected output, or the check."
  - type: textarea
    id: consumers
    attributes:
      label: "Consumers"
      description: "who must act or adopt, one bullet each."

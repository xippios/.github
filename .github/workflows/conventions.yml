# The conventions review (C57 as amended by coordinate-core#364, check `conventions`): this
# repository's scripts/conventions.py has claude-opus-5-5, at effort xhigh (.github#93) on the
# Messages API, judge a pull request against its repository's own documents, the ones the README
# links under `## Documents` on the default branch (C80), and return a verdict. `ready` passes
# the check and `not ready` fails it; either verdict, with its findings, goes to one sticky PR
# comment in the form of docs/style/reviews.md#conventions-check, created on the first run that
# reviews the pull request and edited in place after (.github#36); no verdict (an API error, a
# refusal, the turn cap of 160) fails it with the cause, the turns and the token usage in the
# job summary and posts no comment. The job times out after 45 minutes, which leaves a review at
# effort xhigh the time of 160 turns on one key; a review the timeout ends returns no verdict and
# writes no summary line. The documents are never read from the pull request, so a pull request
# cannot rewrite the rules it is judged by: the repository's own come from the default branch,
# another repository's from its link's ref or the release the head requires. A document the
# review cannot read (a private repository's that no token reaches, a missing file) fails the
# check naming it and the tokens it was read with; a README that links none passes with a
# notice, and no API call is made.
#
# The read token (.github#62): the caller's optional secret DOCUMENTS_READ_TOKEN, used only
# where the calling repository is private (`github.event.repository.private`, the caller's
# payload; .github#83). The review's comment and its job summary quote the documents it
# judges by, so a public caller would publish a private document's text; a private caller's
# can show the sibling's text to everyone who reads that repository. A public caller that
# passes the secret reads as one that passes none, with the Gate's notice where the review
# runs. Another repository's file, a listed document, that repository's pyproject.toml and
# its tags, is read with the workflow's token first; only where GitHub does not find it, a
# private repository's included, is it read again with the read token, so a private
# sibling's document is read and its pin resolves as a public one's does. Any other failure
# fails the check at once. Without the secret, or with it empty, the check reads with the
# workflow's token alone. The token is in the Prepare step's environment alone, and the
# script hands it to gh as the GH_TOKEN of that one read, so no other process, the review's
# included, gets it, and it reaches neither the job summary, documents.json nor the log. Of
# what the check reads with the token, a pull request chooses nothing but a release tag: the
# list of documents comes from the README on the default branch (C80). That bounds the
# check, not the secret, which a changed workflow of any repository that receives it can use;
# which repositories receive it is the organization's setting. A pull request from a fork or
# of Dependabot gets no secret, and the Gate ends it before any read.
#
# A release PR is labeled `release` or titled `<version> Release`, and `release: <version>`
# until every workspace has adopted coordinate-core 0.7.4 (coordinate-core#791,
# coordinate-core#805). The job's own `if:` skips any other PR unless the mode could review it
# (.github#47), so a caller needs no condition and its check `conventions / conventions`
# reports as skipped and passing. A caller runs on no label, so a label set after the
# opening counts from the next push or edit.
#
# The mode is the caller's variable CONVENTIONS_REVIEW, a repository variable over the
# organization's by GitHub's precedence, read without case in the condition and the Gate alike:
# `release` (the default when neither is set) reviews a release PR on any branch; `all` reviews
# every PR; `off` reviews none; another value fails naming the three. A PR the condition skips
# gets no notice, since no job runs; one it admits that the mode does not review passes with
# the Gate's notice.
# On a release PR the review judges the range from the last release tag reachable from the
# base to the head, since the PR's own diff is the CHANGELOG and the bump; without a tag it
# judges the PR's own diff and says so. It names the version the release ships, read from the
# title, else from the head's pyproject.toml.
#
# The review left the Claude Code action for the Messages API, called with an API key, on
# 2026-10-29 (D101 to D103).
#
# The script comes from xippios/.github at `job.workflow_sha`, the commit of the workflow
# file that defines this job (GitHub's contexts reference): for a caller, the .github commit
# its `uses:` resolved to. The workflow runs as a called job only; it left this repository's
# own pull requests on 2026-11-03 (C58). actionlint 1.7.12
# does not know the `job.workflow_*` properties yet: .github/actionlint.yaml ignores that one
# error in this file.
#
# The review runs on the workflow token, `github.token` (decided 2026-10-26), so its
# comment comes from `github-actions[bot]`: the Claude GitHub App's token exchange skips a
# pull request whose calling workflow differs from the default branch's
# (`workflow_not_found_on_default_branch`), which would leave adoption PRs without a
# verdict.
#
# One wiring (C58, 2026-11-03; two until then): called as a job from a repository's gates.yml,
# which passes ANTHROPIC_API_KEY and, in a private repository whose README lists a private
# repository's document, DOCUMENTS_READ_TOKEN, each by name (`on: workflow_call`, check
# `conventions / conventions`); the caller runs on `pull_request` with the types opened,
# synchronize, reopened and edited, with no `if:` on the job, so `github.event.pull_request` is
# there and a change of the title or of the base arrives as `edited`.
#
# The gate, in order: a Dependabot pull request (author and actor both `dependabot[bot]`)
# ends green, reviewed by `ci` only, since Dependabot runs get no Actions secrets. A pull
# request the mode does not review ends green with a notice. A pull request opened or updated
# by any other GitHub App (a login ending in `[bot]`) gets no review and fails, as the
# action's empty `allowed_bots` had it. With the organization secret ANTHROPIC_API_KEY the
# review runs; a pull request from a fork never gets the secret and fails, and one from the
# repository itself with the secret empty fails naming it (coordinate-core#368 shares the
# secret with every repository).
#
# The keys (.github#87): ANTHROPIC_API_KEY holds one key or several, one per line, and the
# script tries them in that order, handing the SDK one key at a time. A review runs on one key
# from its first turn to its verdict. Where the API refuses the key or its account, at the
# first request or a later one, the review starts again from its first turn on the next key:
# an authentication, permission or billing error, a request the API turns down for the
# balance of the account, and a rate limit that outlasts the SDK's retries. Any other end
# without a verdict tries no other key. The summary line names the key the review ended on by
# its position, `key=2/3`, and counts the tokens of every attempt; where the API refused every
# key, it names each by its position and error class. The script redacts every key of the
# secret from what it prints and writes, and the PR comment says nothing of keys. A secret
# with one key reviews as before, and a caller passes the secret as it did.
#
# The model judges and runs nothing. Its material is prepared under .review/ before it
# starts; it reads with three tools the script serves (read_file, list_files, grep) inside
# the workspace's real path only: `.git/`, `.envrc`, `.env` files, symlinks that lead out and
# the script's own checkout are refused. The review spawns no process, and ANTHROPIC_API_KEY
# is in the Review step's environment alone. setup-uv reads the .sdk-gates checkout, and uv
# runs from the runner's temporary directory with --no-config, so nothing in the pull
# request's checkout (a uv.toml, a .python-version, a .venv, a uv version or cache key)
# decides what runs beside the key. Both uv runs resolve with --exclude-newer
# 2026-10-29T00:00:00Z: anthropic is pinned, and its dependencies are frozen at that date
# instead of resolved afresh in the step that holds the key.
#
# The job log is public: the script prints paths, counts, the verdict and redacted error
# text, never a file's content, a tool result or the prompt. `edited` is among the types
# because the description is judged. Actions are pinned to commit SHAs, the version in a
# comment.
name: Conventions

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      DOCUMENTS_READ_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  conventions:
    name: conventions
    # The job's own condition (.github#47): a release PR by its label or its title, or a mode
    # other than `release` and `off`, which reviews every PR or fails naming the three. Any
    # other PR skips the job: no runner starts, and the caller's check reports as skipped and
    # passing. GitHub's functions compare without case and know no regular expression, so a
    # title passes here by its ends and the Gate matches it exactly.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'release')
      || startsWith(github.event.pull_request.title, 'release: ')
      || endsWith(github.event.pull_request.title, ' Release')
      || (vars.CONVENTIONS_REVIEW != '' && vars.CONVENTIONS_REVIEW != 'release'
      && vars.CONVENTIONS_REVIEW != 'off')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A new push or edit supersedes the review of the previous state.
    concurrency:
      group: conventions-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The mode, the label and the title decide first, so a pull request that no mode reviews
      # costs no checkout, no key and no API call (C57 as amended by coordinate-core#364).
      - name: Gate
        id: gate
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          MODE: ${{ vars.CONVENTIONS_REVIEW }}
          TITLE: ${{ github.event.pull_request.title }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          # Whether a public caller passed the read token, which its check does not use
          # (.github#83): a boolean, never the token.
          READ_TOKEN_UNUSED: ${{ secrets.DOCUMENTS_READ_TOKEN != '' && github.event.repository.private != true }}
        run: |
          # A GitHub App's login ends in [bot]; Dependabot has its own branch below.
          app() {
            case "$1" in
              "dependabot[bot]") return 1 ;;
              *"[bot]") return 0 ;;
              *) return 1 ;;
            esac
          }
          # The caller's CONVENTIONS_REVIEW, `release` when neither the repository nor the
          # organization sets it, read without case as the job's condition reads it, so `Off`
          # is `off` in both. The backticks below are Markdown for the summary, not command
          # substitutions.
          mode="${MODE:-release}"
          mode="${mode,,}"
          case "$mode" in
            release|all|off) ;;
            *)
              echo "conventions: CONVENTIONS_REVIEW is \`$MODE\`; it is \`release\`, \`all\` or \`off\` (C57)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
          # A release PR by its label `release`, or by its title (docs/style/pulls.md#release-pr):
          # `<version> Release`, and `release: <version>` until every workspace has adopted
          # coordinate-core 0.7.4 (coordinate-core#805), on any branch. scripts/conventions.py
          # reads the title alike.
          release=false
          if [ "$LABELED" = "true" ]; then
            release=true
          elif printf '%s\n' "$TITLE" | grep -Eq '^(release: v?[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.+-]*)?|[0-9]+\.[0-9]+\.[0-9]+ Release)$'; then
            release=true
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$AUTHOR" = "dependabot[bot]" ] && [ "$ACTOR" = "dependabot[bot]" ]; then
            # shellcheck disable=SC2016
            echo 'conventions: Dependabot PR, reviewed by `ci` only' | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$mode" = "off" ]; then
            echo "conventions: CONVENTIONS_REVIEW is off; the review is switched off for this repository" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$mode" = "release" ] && [ "$release" != "true" ]; then
            # shellcheck disable=SC2016
            echo 'conventions: not a release PR; with CONVENTIONS_REVIEW release the review runs on a PR labeled `release` or titled `<version> Release` or `release: <version>`' | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif app "$AUTHOR" || app "$ACTOR"; then
            echo "conventions: a pull request opened or updated by a GitHub App gets no review" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$HAS_KEY" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [ "$READ_TOKEN_UNUSED" = "true" ]; then
              echo "conventions: DOCUMENTS_READ_TOKEN is not used in a public repository, whose review comment and job summary would show what the review quotes from a private document (.github#83)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$HEAD_REPO" != "$REPO" ]; then
            echo "conventions: a pull request from a fork gets no secrets; the review cannot run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "conventions: ANTHROPIC_API_KEY is empty; the review cannot run. Share the organization secret with this repository (G4)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The full history brings every branch and tag: the default branch, where the README
      # and its documents are read, and the release tags, where a release's range starts.
      - name: Check out the pull request head with full history
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The review script, from the commit that defines this job (see the header); the
      # script refuses its own checkout to the model's tools.
      - name: Check out the review script from xippios/.github
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xippios/.github
          ref: ${{ job.workflow_sha }}
          path: .sdk-gates
          persist-credentials: false

      # Pointed at the script's checkout, so no uv version or cache key comes from the pull
      # request.
      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          working-directory: .sdk-gates
          enable-cache: false

      # Everything the review judges, prepared here because the review runs no command.
      # .review/ is emptied first, so nothing the pull request carries there survives. The
      # documents are the ones the README links under `## Documents` on the default branch,
      # read there and never from the pull request (C80): the repository's own from that
      # branch, another repository's from GitHub with the workflow's token, which reads a
      # public repository, and where GitHub does not find a file with it, with the caller's
      # DOCUMENTS_READ_TOKEN (see the header; .github#62), at the ref its link names or at
      # the release tag of it that the head's pyproject.toml requires (README.md, "The
      # documents"; .github#70). A document neither reads fails, naming it. The read token is
      # in this step's environment alone, and only where the calling repository is private:
      # `case()` yields its last argument, '', for a public caller (.github#83). A README that
      # links none ends the job green here, with a notice and `review=false`: no API call.
      # On a release PR (the gate's `release`) the range runs from the last release tag, and
      # the version comes from the title, else from the head's pyproject.toml.
      - name: Prepare the review material
        id: prepare
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          DOCUMENTS_READ_TOKEN: ${{ case(github.event.repository.private == true, secrets.DOCUMENTS_READ_TOKEN, '') }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN: origin/${{ github.event.repository.default_branch }}
          RELEASE: ${{ steps.gate.outputs.release }}
        run: |
          if [ -L "$GITHUB_WORKSPACE/.sdk-gates" ]; then
            echo "conventions: .sdk-gates is a link; the review cannot run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          set --
          if [ "$RELEASE" = "true" ]; then
            set -- --release
          fi
          uv run --no-project --no-config --exclude-newer 2026-10-29T00:00:00Z \
            --with anthropic==2.3.0 \
            python "$GITHUB_WORKSPACE/.sdk-gates/scripts/conventions.py" prepare \
            --repo "$REPO" --pr "$PR" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --workspace "$GITHUB_WORKSPACE" --main "$MAIN" "$@"

      # The key is in this step's environment alone. The step fails on no verdict, and the
      # Verdict step runs anyway: it reads the verdict file and decides the check.
      - name: Review
        id: review
        if: steps.gate.outputs.run == 'true' && steps.prepare.outputs.review == 'true'
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run --no-project --no-config --exclude-newer 2026-10-29T00:00:00Z \
            --with anthropic==2.3.0 \
            python "$GITHUB_WORKSPACE/.sdk-gates/scripts/conventions.py" review \
            --workspace "$GITHUB_WORKSPACE" --review "$GITHUB_WORKSPACE/.review" \
            --out "$RUNNER_TEMP/verdict.json"

      # The verdict file is the script's; no file, or one without a verdict (the review
      # failed or stopped before its verdict), is no verdict and fails, with the script's
      # summary line. A verdict, `ready` included, is posted as the comment, which follows
      # docs/style/reviews.md#conventions-check: the lead with the count and the head's commit,
      # what was judged, then the findings, each with the document and section it goes against.
      # Anything that looks like a key is redacted before the summary and the comment.
      - name: Verdict
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' && steps.prepare.outputs.review == 'true' }}
        env:
          RESULT_FILE: ${{ runner.temp }}/verdict.json
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          MARKER = "<!-- style: reviews/conventions -->"
          # The marker of the comments before coordinate-core 0.6.4: still the review's.
          OLD_MARKER = "<!-- conventions -->"
          # An Anthropic key, a GitHub token of any kind.
          KEY = re.compile(r"sk-ant-[A-Za-z0-9_-]+|gh[opsur]_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+")
          PR = os.environ["PR"]
          REPO = os.environ["REPO"]
          COMMIT = f"https://github.com/{REPO}/commit/{os.environ['HEAD_SHA']}"


          def summary(text):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write(text)


          def one_line(value):
              return " ".join(str(value).split())


          def plain(value):
              return one_line(value).replace("`", "'")


          def count(number, noun="finding"):
              return f"{number} {noun}{'' if number == 1 else 's'}"


          def gh(*args, body=None):
              return subprocess.run(
                  ["gh", *args, "--repo", REPO], input=body, text=True, capture_output=True,
                  check=False,
              )


          try:
              with open(os.environ["RESULT_FILE"], encoding="utf-8") as handle:
                  result = json.load(handle)
          except (OSError, ValueError):
              result = None
          if not isinstance(result, dict) or result.get("verdict") not in ("ready", "not ready"):
              line = result.get("summary") if isinstance(result, dict) else None
              if not isinstance(line, str) or not line.strip():
                  line = (
                      "conventions: no verdict (the review wrote no result; see the Prepare "
                      "and Review steps)"
                  )
              text = (
                  "## conventions: no verdict\n\n"
                  + KEY.sub("[redacted]", one_line(line))
                  + "\n\nThe review returned no verdict; the check fails.\n"
              )
              summary(text)
              print(text)
              sys.exit(1)
          findings = [f for f in result.get("findings") or [] if isinstance(f, dict)]
          blocking = sum(1 for f in findings if f.get("blocking"))
          verdict = "ready" if result.get("verdict") == "ready" and not blocking else "not ready"
          if verdict != "ready":
              lead = f"**Blocked.** {count(len(findings))}, {blocking} blocking, at {COMMIT}."
          elif findings:
              lead = f"**Findings.** {count(len(findings))}, none blocking, at {COMMIT}."
          else:
              lead = f"**Approved.** No findings at {COMMIT}."
          judged = result.get("range") if isinstance(result.get("range"), dict) else {}
          documents = result.get("documents") if isinstance(result.get("documents"), list) else None
          if judged.get("release") and judged.get("tag"):
              what = f"the release's range from `{plain(judged['tag'])}` to the head"
          elif judged.get("release"):
              what = "the pull request's own diff, since no release tag is reachable from the base"
          else:
              what = "the pull request's own diff"
          against = ""
          if documents is not None:
              against = f", against {count(len(documents), 'document')} of `README.md` on `main`"
          lines = [MARKER, lead, "", f"Judged: {what}{against}."]
          if findings:
              lines.append("")
          for number, finding in enumerate(findings, 1):
              document = plain(finding.get("document") or "")
              where = plain(finding.get("file") or "")
              line = finding.get("line")
              if where and isinstance(line, int) and not isinstance(line, bool) and line > 0:
                  where += f":{line}"
              text = one_line(finding.get("text", ""))
              blocks = "yes" if finding.get("blocking") else "no"
              if document:
                  place = f" `{where}`." if where else ""
                  lines.append(f"{number}. **{document}** {text}{place} Blocks: {blocks}.")
              elif where:
                  lines.append(f"{number}. **`{where}`** {text} Blocks: {blocks}.")
              else:
                  lines.append(f"{number}. **the pull request** {text} Blocks: {blocks}.")
          body = KEY.sub("[redacted]", "\n".join(lines) + "\n")
          summary(body)
          print(body)

          # One sticky comment on every run that reviewed the pull request, `ready` included,
          # since the reviewer cites the verdict there (C57 as amended by coordinate-core#364,
          # .github#36). The last comment this token wrote is edited when it is the review's (by
          # its marker, the old form's too), and the comment is created when the token wrote
          # none. After another workflow's comment, or when the comments could not be read, a
          # new comment is posted, so another workflow's comment is never overwritten.
          last = gh("pr", "view", PR, "--json", "comments",
                    "--jq", '[.comments[] | select(.viewerDidAuthor)] | last | .body // ""')
          known = last.returncode == 0
          ours = known and (last.stdout.startswith(MARKER) or last.stdout.startswith(OLD_MARKER))
          none = known and not last.stdout.strip()
          if ours or none:
              posted = gh("pr", "comment", PR, "--edit-last", "--create-if-none",
                          "--body-file", "-", body=body)
          else:
              posted = gh("pr", "comment", PR, "--body-file", "-", body=body)
          # A failed post leaves the pull request without the verdict while the check still
          # follows it, so the run says why: a line in the summary and a warning annotation,
          # redacted as the comment is (.github#40).
          if posted.returncode != 0:
              reason = KEY.sub("[redacted]", one_line(posted.stderr))
              reason = reason or f"gh exited {posted.returncode}"
              line = f"conventions: posting the PR comment failed: {reason}"
              summary(f"\n{line}\n")
              print("::warning::" + line.replace("%", "%25"))
          sys.exit(0 if verdict == "ready" else 1)
          PY

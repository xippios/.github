# The conventions review (C57 as amended by coordinate-core#364, check `conventions`): this
# repository's scripts/conventions.py has claude-opus-5-5, at effort high on the Messages API,
# judge a pull request against its repository's own documents, the ones the README links under
# `## Documents` on the default branch (C80), and return a verdict. `ready` passes the check
# and `not ready` fails it; either verdict, with its findings, goes to one sticky PR comment in
# the form of docs/style/reviews.md#conventions-check, created on the first run that reviews
# the pull request and edited in place after (.github#36); no verdict (an API error, a refusal,
# the turn cap) fails it with the cause, the turns and the token usage in the job summary and
# posts no comment. The documents are read on the default branch, never from the pull request,
# so a pull request cannot rewrite the rules it is judged by. A document the review cannot read
# (a private repository's, a missing file) fails the check naming it; a README that links none
# passes with a notice, and no API call is made.
#
# The mode is the caller's variable CONVENTIONS_REVIEW, a repository variable over the
# organization's by GitHub's precedence: `release` (the default when neither is set) reviews a
# PR titled `release: <version>` on any branch and passes any other with a notice; `all`
# reviews every PR; `off` passes every PR with a notice; another value fails naming the three.
# On a release PR the review judges the range from the last release tag reachable from the
# base to the head, since the PR's own diff is the CHANGELOG and the bump; without a tag it
# judges the PR's own diff and says so.
#
# The review left the Claude Code action on 2026-10-29 (D101 to D103): the action's usage is
# billed as Claude Code, which the organization's monthly plan credits do not cover, while
# they cover the Messages API called with an API key.
#
# The script comes from xippios/.github at `job.workflow_sha`, the commit of the workflow
# file that defines this job (GitHub's contexts reference): for a caller, the .github commit
# its `uses:` resolved to. The workflow runs as a called job only; it left this repository's
# own pull requests on 2026-11-03 (C58). actionlint 1.7.12
# does not know the `job.workflow_*` properties yet: .github/actionlint.yaml ignores that one
# error in this file.
#
# The review runs on the workflow token, `github.token` (decided 2026-10-26), so its
# comment comes from `github-actions[bot]`: the Claude GitHub App's token exchange skips a
# pull request whose calling workflow differs from the default branch's
# (`workflow_not_found_on_default_branch`), which would leave adoption PRs without a
# verdict.
#
# One wiring (C58, 2026-11-03; two until then): called as a job from a repository's gates.yml,
# which passes ANTHROPIC_API_KEY alone (`on: workflow_call`, check
# `conventions / conventions`); the caller runs on `pull_request` with the types opened,
# synchronize, reopened and edited, so `github.event.pull_request` is there, and a change of
# the title or of the base arrives as `edited`.
#
# The gate, in order: a Dependabot pull request (author and actor both `dependabot[bot]`)
# ends green, reviewed by `ci` only, since Dependabot runs get no Actions secrets. A pull
# request the mode does not review ends green with a notice. A pull request opened or updated
# by any other GitHub App (a login ending in `[bot]`) gets no review and fails, as the
# action's empty `allowed_bots` had it. With the organization secret ANTHROPIC_API_KEY the
# review runs; a pull request from a fork never gets the secret and fails, and one from the
# repository itself with the secret empty fails naming it (coordinate-core#368 shares the
# secret with every repository).
#
# The model judges and runs nothing. Its material is prepared under .review/ before it
# starts; it reads with three tools the script serves (read_file, list_files, grep) inside
# the workspace's real path only: `.git/`, `.envrc`, `.env` files, symlinks that lead out and
# the script's own checkout are refused. The review spawns no process, and ANTHROPIC_API_KEY
# is in the Review step's environment alone. setup-uv reads the .sdk-gates checkout, and uv
# runs from the runner's temporary directory with --no-config, so nothing in the pull
# request's checkout (a uv.toml, a .python-version, a .venv, a uv version or cache key)
# decides what runs beside the key. Both uv runs resolve with --exclude-newer
# 2026-10-29T00:00:00Z: anthropic is pinned, and its dependencies are frozen at that date
# instead of resolved afresh in the step that holds the key.
#
# The job log is public: the script prints paths, counts, the verdict and redacted error
# text, never a file's content, a tool result or the prompt. `edited` is among the types
# because the description is judged. Actions are pinned to commit SHAs, the version in a
# comment.
name: Conventions

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A new push or edit supersedes the review of the previous state.
    concurrency:
      group: conventions-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The mode and the title decide first, so a pull request that no mode reviews costs no
      # checkout, no key and no API call (C57 as amended by coordinate-core#364).
      - name: Gate
        id: gate
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          MODE: ${{ vars.CONVENTIONS_REVIEW }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # A GitHub App's login ends in [bot]; Dependabot has its own branch below.
          app() {
            case "$1" in
              "dependabot[bot]") return 1 ;;
              *"[bot]") return 0 ;;
              *) return 1 ;;
            esac
          }
          # The caller's CONVENTIONS_REVIEW, `release` when neither the repository nor the
          # organization sets it. The backticks below are Markdown for the summary, not
          # command substitutions.
          mode="${MODE:-release}"
          case "$mode" in
            release|all|off) ;;
            *)
              echo "conventions: CONVENTIONS_REVIEW is \`$mode\`; it is \`release\`, \`all\` or \`off\` (C57)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
          # A release PR by its title, `release: <version>` (docs/style/pulls.md), on any branch.
          release=false
          if printf '%s\n' "$TITLE" | grep -Eq '^release: v?[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.+-]*)?$'; then
            release=true
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$AUTHOR" = "dependabot[bot]" ] && [ "$ACTOR" = "dependabot[bot]" ]; then
            # shellcheck disable=SC2016
            echo 'conventions: Dependabot PR, reviewed by `ci` only' | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$mode" = "off" ]; then
            echo "conventions: CONVENTIONS_REVIEW is off; the review is switched off for this repository" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$mode" = "release" ] && [ "$release" != "true" ]; then
            # shellcheck disable=SC2016
            echo 'conventions: not a release PR; with CONVENTIONS_REVIEW release the review runs on a PR titled `release: <version>`' | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif app "$AUTHOR" || app "$ACTOR"; then
            echo "conventions: a pull request opened or updated by a GitHub App gets no review" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$HAS_KEY" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REPO" != "$REPO" ]; then
            echo "conventions: a pull request from a fork gets no secrets; the review cannot run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "conventions: ANTHROPIC_API_KEY is empty; the review cannot run. Share the organization secret with this repository (G4)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The full history brings every branch and tag: the default branch, where the README
      # and its documents are read, and the release tags, where a release's range starts.
      - name: Check out the pull request head with full history
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The review script, from the commit that defines this job (see the header); the
      # script refuses its own checkout to the model's tools.
      - name: Check out the review script from xippios/.github
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xippios/.github
          ref: ${{ job.workflow_sha }}
          path: .sdk-gates
          persist-credentials: false

      # Pointed at the script's checkout, so no uv version or cache key comes from the pull
      # request.
      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          working-directory: .sdk-gates
          enable-cache: false

      # Everything the review judges, prepared here because the review runs no command.
      # .review/ is emptied first, so nothing the pull request carries there survives. The
      # documents are the ones the README links under `## Documents` on the default branch,
      # read there and never from the pull request (C80): the repository's own from that
      # branch, another repository's from GitHub with the workflow's token, which reads a
      # public repository and fails on a private one, naming the document. A README that
      # links none ends the job green here, with a notice and `review=false`: no API call.
      # On a release PR (the gate's `release`) the range runs from the last release tag.
      - name: Prepare the review material
        id: prepare
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN: origin/${{ github.event.repository.default_branch }}
          RELEASE: ${{ steps.gate.outputs.release }}
        run: |
          if [ -L "$GITHUB_WORKSPACE/.sdk-gates" ]; then
            echo "conventions: .sdk-gates is a link; the review cannot run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          set --
          if [ "$RELEASE" = "true" ]; then
            set -- --release
          fi
          uv run --no-project --no-config --exclude-newer 2026-10-29T00:00:00Z \
            --with anthropic==2.3.0 \
            python "$GITHUB_WORKSPACE/.sdk-gates/scripts/conventions.py" prepare \
            --repo "$REPO" --pr "$PR" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --workspace "$GITHUB_WORKSPACE" --main "$MAIN" "$@"

      # The key is in this step's environment alone. The step fails on no verdict, and the
      # Verdict step runs anyway: it reads the verdict file and decides the check.
      - name: Review
        id: review
        if: steps.gate.outputs.run == 'true' && steps.prepare.outputs.review == 'true'
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run --no-project --no-config --exclude-newer 2026-10-29T00:00:00Z \
            --with anthropic==2.3.0 \
            python "$GITHUB_WORKSPACE/.sdk-gates/scripts/conventions.py" review \
            --workspace "$GITHUB_WORKSPACE" --review "$GITHUB_WORKSPACE/.review" \
            --out "$RUNNER_TEMP/verdict.json"

      # The verdict file is the script's; no file, or one without a verdict (the review
      # failed or stopped before its verdict), is no verdict and fails, with the script's
      # summary line. A verdict, `ready` included, is posted as the comment, which follows
      # docs/style/reviews.md#conventions-check: the lead with the count and the head's commit,
      # what was judged, then the findings, each with the document and section it goes against.
      # Anything that looks like a key is redacted before the summary and the comment.
      - name: Verdict
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' && steps.prepare.outputs.review == 'true' }}
        env:
          RESULT_FILE: ${{ runner.temp }}/verdict.json
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          MARKER = "<!-- style: reviews/conventions -->"
          # The marker of the comments before coordinate-core 0.6.4: still the review's.
          OLD_MARKER = "<!-- conventions -->"
          # An Anthropic key, a GitHub token of any kind.
          KEY = re.compile(r"sk-ant-[A-Za-z0-9_-]+|gh[opsur]_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+")
          PR = os.environ["PR"]
          REPO = os.environ["REPO"]
          COMMIT = f"https://github.com/{REPO}/commit/{os.environ['HEAD_SHA']}"


          def summary(text):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write(text)


          def one_line(value):
              return " ".join(str(value).split())


          def plain(value):
              return one_line(value).replace("`", "'")


          def count(number, noun="finding"):
              return f"{number} {noun}{'' if number == 1 else 's'}"


          def gh(*args, body=None):
              return subprocess.run(
                  ["gh", *args, "--repo", REPO], input=body, text=True, capture_output=True,
                  check=False,
              )


          try:
              with open(os.environ["RESULT_FILE"], encoding="utf-8") as handle:
                  result = json.load(handle)
          except (OSError, ValueError):
              result = None
          if not isinstance(result, dict) or result.get("verdict") not in ("ready", "not ready"):
              line = result.get("summary") if isinstance(result, dict) else None
              if not isinstance(line, str) or not line.strip():
                  line = (
                      "conventions: no verdict (the review wrote no result; see the Prepare "
                      "and Review steps)"
                  )
              text = (
                  "## conventions: no verdict\n\n"
                  + KEY.sub("[redacted]", one_line(line))
                  + "\n\nThe review returned no verdict; the check fails.\n"
              )
              summary(text)
              print(text)
              sys.exit(1)
          findings = [f for f in result.get("findings") or [] if isinstance(f, dict)]
          blocking = sum(1 for f in findings if f.get("blocking"))
          verdict = "ready" if result.get("verdict") == "ready" and not blocking else "not ready"
          if verdict != "ready":
              lead = f"**Blocked.** {count(len(findings))}, {blocking} blocking, at {COMMIT}."
          elif findings:
              lead = f"**Findings.** {count(len(findings))}, none blocking, at {COMMIT}."
          else:
              lead = f"**Approved.** No findings at {COMMIT}."
          judged = result.get("range") if isinstance(result.get("range"), dict) else {}
          documents = result.get("documents") if isinstance(result.get("documents"), list) else None
          if judged.get("release") and judged.get("tag"):
              what = f"the release's range from `{plain(judged['tag'])}` to the head"
          elif judged.get("release"):
              what = "the pull request's own diff, since no release tag is reachable from the base"
          else:
              what = "the pull request's own diff"
          against = ""
          if documents is not None:
              against = f", against {count(len(documents), 'document')} of `README.md` on `main`"
          lines = [MARKER, lead, "", f"Judged: {what}{against}."]
          if findings:
              lines.append("")
          for number, finding in enumerate(findings, 1):
              document = plain(finding.get("document") or "")
              where = plain(finding.get("file") or "")
              line = finding.get("line")
              if where and isinstance(line, int) and not isinstance(line, bool) and line > 0:
                  where += f":{line}"
              text = one_line(finding.get("text", ""))
              blocks = "yes" if finding.get("blocking") else "no"
              if document:
                  place = f" `{where}`." if where else ""
                  lines.append(f"{number}. **{document}** {text}{place} Blocks: {blocks}.")
              elif where:
                  lines.append(f"{number}. **`{where}`** {text} Blocks: {blocks}.")
              else:
                  lines.append(f"{number}. **the pull request** {text} Blocks: {blocks}.")
          body = KEY.sub("[redacted]", "\n".join(lines) + "\n")
          summary(body)
          print(body)

          # One sticky comment on every run that reviewed the pull request, `ready` included,
          # since the reviewer cites the verdict there (C57 as amended by coordinate-core#364,
          # .github#36). The last comment this token wrote is edited when it is the review's (by
          # its marker, the old form's too), and the comment is created when the token wrote
          # none. After another workflow's comment, or when the comments could not be read, a
          # new comment is posted, so another workflow's comment is never overwritten.
          last = gh("pr", "view", PR, "--json", "comments",
                    "--jq", '[.comments[] | select(.viewerDidAuthor)] | last | .body // ""')
          known = last.returncode == 0
          ours = known and (last.stdout.startswith(MARKER) or last.stdout.startswith(OLD_MARKER))
          none = known and not last.stdout.strip()
          if ours or none:
              posted = gh("pr", "comment", PR, "--edit-last", "--create-if-none",
                          "--body-file", "-", body=body)
          else:
              posted = gh("pr", "comment", PR, "--body-file", "-", body=body)
          # A failed post leaves the pull request without the verdict while the check still
          # follows it, so the run says why: a line in the summary and a warning annotation,
          # redacted as the comment is (.github#40).
          if posted.returncode != 0:
              reason = KEY.sub("[redacted]", one_line(posted.stderr))
              reason = reason or f"gh exited {posted.returncode}"
              line = f"conventions: posting the PR comment failed: {reason}"
              summary(f"\n{line}\n")
              print("::warning::" + line.replace("%", "%25"))
          sys.exit(0 if verdict == "ready" else 1)
          PY

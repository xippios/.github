name: Site tests

on:
  workflow_call:
    inputs:
      site:
        description: the site's key, which names its package xippios/web-<site> and its suite in the host
        required: true
        type: string
    secrets:
      WEB_READ_TOKEN:
        description: the organization's token that reads xippios-web and the sites it requires
        required: true

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: token
        env:
          WEB_READ_TOKEN: ${{ secrets.WEB_READ_TOKEN }}
        run: |
          if [ -z "$WEB_READ_TOKEN" ]; then
            echo "::error::site-tests: the secret WEB_READ_TOKEN is empty; a pull request from a fork never gets it"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xippios/xippios-web
          ref: main
          path: host
          token: ${{ secrets.WEB_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer:2.11.1
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: site
        working-directory: site
        env:
          SITE: ${{ inputs.site }}
        run: |
          if ! [[ "$SITE" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]]; then
            echo "::error::site-tests: the input site is no site key: lowercase letters, digits and single hyphens, starting with a letter"
            exit 1
          fi
          if [ "$(composer config name)" != "xippios/web-$SITE" ]; then
            echo "::error::site-tests: the site's composer.json does not name xippios/web-$SITE"
            exit 1
          fi
          git branch --force site-tests HEAD
      - name: require
        working-directory: host
        env:
          SITE: ${{ inputs.site }}
          WEB_READ_TOKEN: ${{ secrets.WEB_READ_TOKEN }}
        run: |
          export COMPOSER_AUTH="{\"github-oauth\": {\"github.com\": \"$WEB_READ_TOKEN\"}}"
          composer config --no-plugins repositories.site-tests vcs "$GITHUB_WORKSPACE/site"
          composer require "xippios/web-$SITE:dev-site-tests" --update-with-dependencies --no-scripts --no-plugins --no-interaction --no-progress
      - name: environment
        working-directory: host
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          composer dump-autoload --no-interaction
          php artisan key:generate --no-interaction
      - name: suite
        working-directory: host
        env:
          SITE: ${{ inputs.site }}
        run: |
          php artisan test --testsuite="$SITE"
      - name: build
        working-directory: host
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/site/tests/Browser" ]; then
            echo "site-tests: the site has no tests/Browser, so the host's assets are not built"
            exit 0
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: dusk
        working-directory: host
        env:
          SITE: ${{ inputs.site }}
          APP_URL: http://127.0.0.1:8000
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/site/tests/Browser" ]; then
            echo "::notice::site-tests: the site has no tests/Browser, so Dusk does not run"
            exit 0
          fi
          php artisan dusk:chrome-driver --detect
          php artisan serve --no-reload > "$RUNNER_TEMP/serve.log" 2>&1 &
          php artisan dusk --testsuite="$SITE"

name: Spelling

on:
  workflow_call:
    inputs:
      paths:
        description: the files and directories to check, separated by spaces or newlines
        required: true
        type: string
      ignore-words:
        description: the words codespell lets pass, separated by commas
        required: false
        type: string
        default: cancelled

permissions:
  contents: read

jobs:
  spelling:
    name: spelling
    if: vars.WORKFLOW_SPELLING != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false
      - name: codespell
        env:
          PATHS: ${{ inputs.paths }}
          IGNORE_WORDS: ${{ inputs.ignore-words }}
        run: |
          read -r -d '' -a paths <<< "$PATHS" || true
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "::error::spelling: the caller names no path"
            exit 1
          fi
          targets=()
          missing=0
          for path in "${paths[@]}"; do
            if [ -e "$GITHUB_WORKSPACE/$path" ]; then
              targets+=("$GITHUB_WORKSPACE/$path")
            else
              echo "::error::spelling: $path does not exist"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          cd "$RUNNER_TEMP"
          uvx --no-config codespell@2.4.3 --builtin en-GB_to_en-US \
            --regex '[A-Z]?[a-z]+|[A-Z]+(?![a-z])' --check-hidden --skip .git \
            --ignore-words-list "$IGNORE_WORDS" -- "${targets[@]}"

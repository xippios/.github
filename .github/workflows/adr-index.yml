name: ADR index

on:
  workflow_call:

permissions:
  contents: read

jobs:
  adr-index:
    name: adr-index
    if: vars.WORKFLOW_ADR_INDEX != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: index
        run: |
          script=scripts/adr_index.py
          run="python3 -I $script"
          escape() {
            local text=${1//%/%25}
            text=${text//$'\r'/%0D}
            printf '%s' "${text//$'\n'/%0A}"
          }
          status=0
          declare -A taken=()
          shopt -s nullglob
          for record in docs/adr/[0-9][0-9][0-9][0-9]-?*.md; do
            [ -f "$record" ] || continue
            number=${record:9:4}
            if [ -n "${taken[$number]:-}" ]; then
              echo "::error::adr-index: $(escape "ADR-$number is taken by ${taken[$number]} and by $record"); renumber one, then run \`$run\`"
              status=1
            else
              taken[$number]=$record
            fi
          done
          if [ ! -f "$script" ]; then
            echo "::error::adr-index: the caller has no $script; its template renders it, and \`$run\` writes the index"
            exit 1
          fi
          python3 --version
          if ! python3 -I "$script" --check; then
            echo "::error::adr-index: \`$run --check\` failed; mend first any record its lines above name, then run \`$run\`, which writes docs/adr.md and docs/adr.json from docs/adr/, and commit both"
            status=1
          fi
          exit "$status"

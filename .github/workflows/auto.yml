# The auto gate of the xippios workspaces (coordinate-core 0.4.0, C50): a run's pull request, on a
# `run/*` branch of this repository and opened by the platform account named in the organisation
# variable COORDINATE_PLATFORM_LOGIN, is approved with the coordinate App's token (the organisation's
# COORDINATE_APP_ID and COORDINATE_APP_PEM), so it merges on green CI under a ruleset that requires
# one approval. Every other pull request gets nothing here: the reviewer's `coordinate pr review`
# or the human's code-owner approval decides. A reusable workflow, called from each repository's
# gates.yml (`uses: xippios/.github/.github/workflows/auto.yml@main`, `secrets: inherit`) on
# `pull_request`, so a fork's pull request has no secrets and is skipped by the condition.
# Every push to the pull request runs it again, since the rulesets dismiss stale approvals.
# Actions are pinned to commit SHAs, the version in a comment.
name: Auto

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  auto:
    name: auto
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      startsWith(github.event.pull_request.head.ref, 'run/')
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.COORDINATE_PLATFORM_LOGIN != ''
      && github.event.pull_request.user.login == vars.COORDINATE_PLATFORM_LOGIN
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app
        with:
          app-id: ${{ vars.COORDINATE_APP_ID }}
          private-key: ${{ secrets.COORDINATE_APP_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Approve the run's pull request as the App
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/$REPO/pulls/$NUMBER/reviews" \
            -f event=APPROVE -f commit_id="$HEAD" \
            -f body="auto: a run's pull request on run/*, approved by the coordinate App at $HEAD (C50)"
          echo "approved $REPO#$NUMBER @ $HEAD as the coordinate App" >> "$GITHUB_STEP_SUMMARY"

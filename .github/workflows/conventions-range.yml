name: Conventions range

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      DOCUMENTS_READ_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: read
  issues: read

jobs:
  range:
    name: range
    if: fromJSON('false')
    runs-on: ubuntu-latest
    steps:
      - run: exit 0

name: Conventions range

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      DOCUMENTS_READ_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: read
  issues: read

jobs:
  gate:
    name: gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      pr: ${{ steps.gate.outputs.pr }}
    steps:
      - name: Check out the script for the gate from xippios/.github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xippios/.github
          ref: ${{ job.workflow_sha }}
          path: .sdk-gates
          persist-credentials: false

      - name: Gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I "$GITHUB_WORKSPACE/.sdk-gates/scripts/conventions.py" range-gate

  range:
    name: range
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: conventions-range-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the script for the key from xippios/.github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xippios/.github
          ref: ${{ job.workflow_sha }}
          path: .sdk-gates
          persist-credentials: false

      - name: Key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: python3 -I "$GITHUB_WORKSPACE/.sdk-gates/scripts/conventions.py" range-key

      - name: Check out the commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the review script from xippios/.github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xippios/.github
          ref: ${{ job.workflow_sha }}
          path: .sdk-gates
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          working-directory: .sdk-gates
          enable-cache: false

      - name: Prepare the range material
        id: prepare
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          DOCUMENTS_READ_TOKEN: ${{ case(github.event.repository.private == true, secrets.DOCUMENTS_READ_TOKEN, '') }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          MAIN: origin/${{ github.event.repository.default_branch }}
        run: |
          if [ -L "$GITHUB_WORKSPACE/.sdk-gates" ]; then
            echo "conventions: .sdk-gates is a link; the review cannot run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          uv run --no-project --no-config --exclude-newer 2026-10-29T00:00:00Z \
            --with anthropic==2.3.0 \
            python "$GITHUB_WORKSPACE/.sdk-gates/scripts/conventions.py" range-prepare \
            --repo "$REPO" --commit "$COMMIT" --workspace "$GITHUB_WORKSPACE" --main "$MAIN"

      - name: Review
        id: review
        if: steps.prepare.outputs.review == 'true'
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run --no-project --no-config --exclude-newer 2026-10-29T00:00:00Z \
            --with anthropic==2.3.0 \
            python "$GITHUB_WORKSPACE/.sdk-gates/scripts/conventions.py" review \
            --workspace "$GITHUB_WORKSPACE" --review "$GITHUB_WORKSPACE/.review" \
            --out "$RUNNER_TEMP/verdict.json"

      - name: Verdict
        if: ${{ !cancelled() && steps.prepare.outputs.review == 'true' }}
        env:
          RESULT_FILE: ${{ runner.temp }}/verdict.json
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr }}
          COMMIT: ${{ github.sha }}
        run: python3 -I "$GITHUB_WORKSPACE/.sdk-gates/scripts/conventions.py" range-verdict

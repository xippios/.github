# The family review of the xippios SDK family: this repository's scripts/family_review.py
# has claude-opus-5-5, at effort high on the Messages API, apply the review checklist from
# sdk-core's main to the pull request and return a verdict. `ready` passes the check; `not
# ready` fails it, and the findings go to one sticky PR comment; no verdict (an API error, a
# refusal, the turn cap) fails it with the cause, the turns and the token usage in the job
# summary. The checklist, conventions, definition of done and ADRs are read from sdk-core's
# main, never from the pull request; the one exception is an sdk-core pull request that
# changes them, reviewed against its branch's version of exactly those documents (it is class
# human, so Johannes reads the change). Without them the review fails closed.
#
# The review left the Claude Code action on 2026-10-29 (D101 to D103): the action's usage is
# billed as Claude Code, which the organisation's monthly plan credits do not cover, while
# they cover the Messages API called with an API key.
#
# The script comes from xippios/sdk-gates at `job.workflow_sha`, the commit of the workflow
# file that defines this job (GitHub's contexts reference): on this repository's own pull
# requests the pull request's merge commit, so a change to the review reviews itself with its
# own script; for a caller, the sdk-gates commit its `uses:` resolved to. actionlint 1.7.12
# does not know the `job.workflow_*` properties yet: .github/actionlint.yaml ignores that one
# error in this file.
#
# The review runs on the workflow token, `github.token` (decided 2026-10-26), so its
# comment comes from `github-actions[bot]`: the Claude GitHub App's token exchange skips a
# pull request whose calling workflow differs from the default branch's
# (`workflow_not_found_on_default_branch`), which would leave adoption PRs without a
# verdict.
#
# Two wirings (decided 2026-10-26): required by a ruleset as a workflow (`on: pull_request`,
# check `family-review`), or called as a job from a repository's caller workflow, gates.yml,
# which passes ANTHROPIC_API_KEY alone (`on: workflow_call`, check
# `family-review / family-review`).
#
# The gate, in order: a Dependabot pull request (author and actor both `dependabot[bot]`)
# ends green, reviewed by `ci` only, since Dependabot runs get no Actions secrets. A pull
# request opened or updated by any other GitHub App (a login ending in `[bot]`) gets no
# review and fails, as the action's empty `allowed_bots` had it. With the org secret
# ANTHROPIC_API_KEY the review runs. Without it, a pull request from a fork fails (it never
# gets the secret, so it is never green unreviewed); one from the repository itself ends
# green with a notice, or fails once the org variable FAMILY_REVIEW_REQUIRED is "1", which
# Johannes sets when the secret exists.
#
# The model judges and runs nothing. Its material is prepared under .review/ before it
# starts; it reads with three tools the script serves (read_file, list_files, grep) inside
# the workspace's real path only: `.git/`, `.envrc`, `.env` files, symlinks that lead out and
# the script's own checkout are refused. The review spawns no process, and ANTHROPIC_API_KEY
# is in the Review step's environment alone. uv runs from the runner's temporary directory
# with --no-config, so nothing in the pull request's checkout (a uv.toml, a .python-version,
# a .venv) decides what runs beside the key.
#
# The job log is public: the script prints paths, counts, the verdict and redacted error
# text, never a file's content, a tool result or the prompt. `edited` is among the types
# because the description is judged. Actions are pinned to commit SHAs, the version in a
# comment.
name: family-review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  family-review:
    name: family-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A new push or edit supersedes the review of the previous state.
    concurrency:
      group: family-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Gate
        id: gate
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          REQUIRED: ${{ vars.FAMILY_REVIEW_REQUIRED }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # A GitHub App's login ends in [bot]; Dependabot has its own branch below.
          app() {
            case "$1" in
              "dependabot[bot]") return 1 ;;
              *"[bot]") return 0 ;;
              *) return 1 ;;
            esac
          }
          if [ "$AUTHOR" = "dependabot[bot]" ] && [ "$ACTOR" = "dependabot[bot]" ]; then
            # The backticks are Markdown for the summary, not a command substitution.
            # shellcheck disable=SC2016
            echo 'family-review: Dependabot PR, reviewed by `ci` only' | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif app "$AUTHOR" || app "$ACTOR"; then
            echo "family-review: a pull request opened or updated by a GitHub App gets no review" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$HAS_KEY" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REPO" != "$REPO" ]; then
            echo "family-review: a pull request from a fork gets no secrets; the review cannot run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$REQUIRED" = "1" ]; then
            echo "family-review: FAMILY_REVIEW_REQUIRED is 1 but ANTHROPIC_API_KEY is empty; the review cannot run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "family-review: no ANTHROPIC_API_KEY org secret; review skipped (required by no ruleset until it exists)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the pull request head with full history
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Into a directory the pull request cannot shadow: actions/checkout empties a target
      # that is not already a clone of the repository it checks out.
      - name: Check out the family documents from main of xippios/sdk-core
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xippios/sdk-core
          ref: main
          path: .sdk-core-main
          persist-credentials: false

      # The review script, from the commit that defines this job (see the header); the
      # script refuses its own checkout to the model's tools.
      - name: Check out the review script from xippios/sdk-gates
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xippios/sdk-gates
          ref: ${{ job.workflow_sha }}
          path: .sdk-gates
          persist-credentials: false

      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false

      # Everything the review judges, prepared here because the review runs no command.
      # .review/ is emptied first, so nothing the pull request carries there survives. The
      # family documents must be there, from sdk-core's main or, for an sdk-core pull
      # request that changes them, its branch's version of exactly those; else it fails.
      - name: Prepare the review material
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -L "$GITHUB_WORKSPACE/.sdk-gates" ]; then
            echo "family-review: .sdk-gates is a link; the review cannot run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          uv run --no-project --no-config --with anthropic==2.3.0 \
            python "$GITHUB_WORKSPACE/.sdk-gates/scripts/family_review.py" prepare \
            --repo "$REPO" --pr "$PR" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --workspace "$GITHUB_WORKSPACE"

      # The key is in this step's environment alone. The step fails on no verdict, and the
      # Verdict step runs anyway: it reads the verdict file and decides the check.
      - name: Review
        id: review
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run --no-project --no-config --with anthropic==2.3.0 \
            python "$GITHUB_WORKSPACE/.sdk-gates/scripts/family_review.py" review \
            --workspace "$GITHUB_WORKSPACE" --review "$GITHUB_WORKSPACE/.review" \
            --docs "$GITHUB_WORKSPACE/.sdk-core-main" --out "$RUNNER_TEMP/verdict.json"

      # The verdict file is the script's; no file, or one without a verdict (the review
      # failed or stopped before its verdict), is no verdict and fails, with the script's
      # summary line. Anything that looks like a key is redacted before the summary and the
      # comment.
      - name: Verdict
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          RESULT_FILE: ${{ runner.temp }}/verdict.json
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          MARKER = "<!-- family-review -->"
          # An Anthropic key, a GitHub token of any kind.
          KEY = re.compile(r"sk-ant-[A-Za-z0-9_-]+|gh[opsur]_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+")
          PR = os.environ["PR"]
          REPO = os.environ["REPO"]


          def summary(text):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write(text)


          def one_line(value):
              return " ".join(str(value).split())


          def gh(*args, body=None):
              return subprocess.run(
                  ["gh", *args, "--repo", REPO], input=body, text=True, capture_output=True,
                  check=False,
              )


          try:
              with open(os.environ["RESULT_FILE"], encoding="utf-8") as handle:
                  result = json.load(handle)
          except (OSError, ValueError):
              result = None
          if not isinstance(result, dict) or result.get("verdict") not in ("ready", "not ready"):
              line = result.get("summary") if isinstance(result, dict) else None
              if not isinstance(line, str) or not line.strip():
                  line = (
                      "family-review: no verdict (the review wrote no result; see the Prepare "
                      "and Review steps)"
                  )
              text = (
                  "## family-review: no verdict\n\n"
                  + KEY.sub("[redacted]", one_line(line))
                  + "\n\nThe review returned no verdict; the check fails.\n"
              )
              summary(text)
              print(text)
              sys.exit(1)
          findings = [f for f in result.get("findings") or [] if isinstance(f, dict)]
          blocking = any(f.get("blocking") for f in findings)
          verdict = "ready" if result.get("verdict") == "ready" and not blocking else "not ready"
          lines = [MARKER, f"## family-review: `{verdict}`", ""]
          lines += [f"Head `{os.environ['HEAD_SHA'][:12]}`.", ""]
          for finding in findings:
              where = one_line(finding.get("file") or "the pull request").replace("`", "'")
              line = finding.get("line")
              if isinstance(line, int) and not isinstance(line, bool) and line > 0:
                  where += f":{line}"
              kind = "blocking" if finding.get("blocking") else "non-blocking"
              lines.append(f"- **{kind}** `{where}`: {one_line(finding.get('text', ''))}")
          if not findings:
              lines.append("No findings.")
          body = KEY.sub("[redacted]", "\n".join(lines) + "\n")
          summary(body)
          print(body)

          # One sticky comment. The last comment this token wrote is edited when it is the
          # review's (by its marker), or created when there is none and the verdict is not
          # ready; another workflow's comment is never overwritten. `ready` only updates an
          # earlier verdict.
          last = gh("pr", "view", PR, "--json", "comments",
                    "--jq", '[.comments[] | select(.viewerDidAuthor)] | last | .body // ""')
          known = last.returncode == 0
          ours = known and last.stdout.startswith(MARKER)
          none = known and not last.stdout.strip()
          posted = None
          if ours or (none and verdict != "ready"):
              posted = gh("pr", "comment", PR, "--edit-last", "--create-if-none",
                          "--body-file", "-", body=body)
          elif verdict != "ready":
              posted = gh("pr", "comment", PR, "--body-file", "-", body=body)
          if posted is not None and posted.returncode != 0:
              print(f"family-review: posting the PR comment failed: {posted.stderr.strip()}",
                    file=sys.stderr)
          sys.exit(0 if verdict == "ready" else 1)
          PY
